server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container (see docker-compose service name).
    # SSE streaming (chat) needs buffering off and a long read timeout.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA fallback so client-side routing (if added later) doesn't 404 on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
